# Public RSS/Atom feeds. YouTube channel RSS can 404/500 intermittently;
# the builder retries those URLs. Disable a feed with enabled: false.

categories:
  - id: street
    name: Street / Grudge
    nav: Street / Grudge
    featured: true
    section_title: Grudge Board
    kicker: Callouts & Beef
    description: No-prep, grudge, and street-car racing from public video channels and news pages. This is the lead beat on the front page.
  - id: drag
    name: Drag Racing / NHRA
    nav: Drag Racing
    featured: false
    section_title: On the Tree
    kicker: Lights Out
    description: NHRA, sportsman classes, and drag racing — right after the street and grudge board.
  - id: dirt
    name: Dirt Track
    nav: Dirt
    featured: false
    section_title: On the Cushion
    kicker: On the Cushion
    description: Sprint cars, late models, modifieds, midgets, micros, stock cars, and karts — every dirt class we can find a public feed for.
  - id: nascar
    name: NASCAR
    nav: NASCAR
    featured: false
    section_title: The Big Oval
    kicker: Stock cars
    description: Cup, Xfinity, and Truck Series headlines from public racing feeds.
  - id: f1
    name: Formula 1
    nav: Formula 1
    featured: false
    section_title: Lights Out, Worldwide
    kicker: Formula 1
    description: Formula 1 news from the official feed and independent motorsport desks.
  - id: indycar
    name: IndyCar
    nav: IndyCar
    featured: false
    section_title: Open Wheel, U.S.
    kicker: IndyCar
    description: NTT IndyCar Series and related open-wheel coverage.
  - id: imsa
    name: IMSA / Sportscar
    nav: IMSA
    featured: false
    section_title: Endurance
    kicker: IMSA
    description: IMSA, endurance, and sportscar racing.

tags:
  - id: engines
    name: Engines / Tech
    description: Engine and technical stories, including Chevy and sportsman-relevant coverage.

