# Accounts people can follow from Speed-Demon News.
# Add a person or team here, then rebuild (`./build.sh` locally, or push
# to main for the live site). Only add URLs you have confirmed are theirs.
#
# Fields:
#   name:       Display name
#   category:   One of the site category ids: street (Outlaw Racing), drag,
#               dirt, nascar, imsa
#   note:       Optional short, factual blurb
#   featured:   true to include the account in the homepage sidebar highlights
#   platforms:  Only include platforms you have verified. Supported keys:
#               youtube, x, instagram, facebook, tiktok
#               Each value must be a full https:// URL.
#   enabled:    false to hide without deleting
#
# The Follow page groups cards by category, Outlaw Racing first.
# Every link opens in a new tab with rel="noopener noreferrer".

page:
  kicker: The crew
  headline: Follow
  lede: >-
    Accounts we watch, and that you can follow too. We add people here as we
    go. Every link goes to their official page.

accounts:
  - name: 1320Video
    category: street
    featured: true
    enabled: true
    note: Street, no-prep, and grudge video from 1320Video.
    platforms:
      youtube: https://www.youtube.com/@1320video
      x: https://x.com/1320video
      instagram: https://www.instagram.com/1320video/
      facebook: https://www.facebook.com/1320videos
      tiktok: https://www.tiktok.com/@1320videoofficial

